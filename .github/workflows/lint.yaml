name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Compile and test
        run: |
          npm run hardhat:compile
          npm run hardhat:test
          npm run next:test

      - name: Run nextjs lint
        run: npm run next:lint -- --max-warnings=0

      - name: Check typings on nextjs
        run: npm run next:check-types

      - name: Run hardhat lint
        run: npm run hardhat:lint -- --max-warnings=0
